# 服务器端 Docker Compose 配置
# 用途：由 GitHub Actions 推送 GHCR 镜像后，在 VPS 上滚动更新

services:
  # Next.js 应用（生产环境 - 使用远程镜像）
  app:
    image: ${IMAGE_NAME:-ghcr.io/unilei/kerkerker}:${IMAGE_TAG:-latest}
    container_name: kerkerker-app
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3003}:3000"
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
      - KKPAN_SYNC_CRON_SECRET=${KKPAN_SYNC_CRON_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - MONGODB_URI=mongodb://mongodb:27017/kerkerker
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-kerkerker}
      - NEXT_PUBLIC_DOUBAN_API_URL=${NEXT_PUBLIC_DOUBAN_API_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://www.aipan.me}
      - KERKERKER_PLUGIN_PROFILE=${KERKERKER_PLUGIN_PROFILE:-cn-default}
      - KERKERKER_PLUGIN_REGION=${KERKERKER_PLUGIN_REGION:-CN}
      - TMDB_PLUGIN_URL=${TMDB_PLUGIN_URL:-https://iamyourfather.link0.me/plugin}
      - TMDB_PLUGIN_SERVICE_TOKEN=${TMDB_PLUGIN_SERVICE_TOKEN}
      - CLOUDFLARE_R2_PUBLIC_URL=${CLOUDFLARE_R2_PUBLIC_URL:-}
      - CLOUDFLARE_R2_UPLOAD_API_URL=${CLOUDFLARE_R2_UPLOAD_API_URL:-}
      - CLOUDFLARE_R2_UPLOAD_API_TOKEN=${CLOUDFLARE_R2_UPLOAD_API_TOKEN:-}
      - CLOUDFLARE_R2_MAX_IMAGE_BYTES=${CLOUDFLARE_R2_MAX_IMAGE_BYTES:-10485760}
      - KERKERKER_COMPLIANCE_MODE=${KERKERKER_COMPLIANCE_MODE:-audit}
      - ADMIN_AUDIT_ACTOR_ID=${ADMIN_AUDIT_ACTOR_ID:-admin-session}
      - KERKERKER_JOB_REPORT_TOKEN=${KERKERKER_JOB_REPORT_TOKEN}
      - NEXT_PUBLIC_DANMU_API_URL=${NEXT_PUBLIC_DANMU_API_URL}
      - NEXT_PUBLIC_DANMU_API_TOKEN=${NEXT_PUBLIC_DANMU_API_TOKEN}
      - KKPAN_API_BASE=${KKPAN_API_BASE:-https://www.kkpans.com}
      - PAN_SYNC_SCHEDULER_DISABLED=${PAN_SYNC_SCHEDULER_DISABLED:-false}
      - PAN_SYNC_SCHEDULER_POLL_MS=${PAN_SYNC_SCHEDULER_POLL_MS:-30000}
      - PAN_SYNC_CATALOG_JOB_MODE=${PAN_SYNC_CATALOG_JOB_MODE:-off}
    depends_on:
      mongodb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kerkerker-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # MongoDB 数据库服务
  mongodb:
    image: mongo:7
    container_name: kerkerker-mongodb
    environment:
      - MONGO_INITDB_DATABASE=kerkerker
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kerkerker-network
    restart: unless-stopped

networks:
  kerkerker-network:
    driver: bridge

volumes:
  mongodb-data:
    name: kerkerker_mongodb-data
    driver: local
  mongodb-config:
    name: kerkerker_mongodb-config
    driver: local
