name: Deploy Kerkerker (cn-compliance)

on:
  push:
    branches:
      - cn-compliance
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag (defaults to the commit SHA)"
        required: false
        type: string

concurrency:
  group: kerkerker-cn-compliance-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME || format('ghcr.io/{0}/kerkerker', github.repository_owner) }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/www/wwwroot/kerkerker' }}
  DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '3003' }}
  DEPLOY_BIND: ${{ vars.DEPLOY_BIND || '0.0.0.0' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check public plugin contract
        run: npm run plugin-contract:check

      - name: Test public plugin contract
        run: npm run plugin-contract:test

      - name: Test packed public plugin contract
        run: npm run plugin-contract:pack-test

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          test_files=(tests/*.test.ts)
          if (( ${#test_files[@]} == 0 )); then
            echo "No test files found" >&2
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            npx tsx "$test_file"
          done

  publish:
    name: Build and publish Docker image
    needs: verify
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image tag
        id: image
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_IMAGE_TAG:-${GITHUB_SHA}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_DOUBAN_API_URL=${{ secrets.DEPLOY_DOUBAN_API_URL || 'http://host.docker.internal:8081' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_NAME }}:cn-compliance-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to Docker VPS
    needs: publish
    if: github.repository_owner == 'unilei'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_ADMIN_PASSWORD: ${{ secrets.DEPLOY_ADMIN_PASSWORD }}
          DEPLOY_DOUBAN_API_URL: ${{ secrets.DEPLOY_DOUBAN_API_URL }}
          DEPLOY_ADMIN_SESSION_SECRET: ${{ secrets.DEPLOY_ADMIN_SESSION_SECRET }}
          DEPLOY_KKPAN_SYNC_CRON_SECRET: ${{ secrets.DEPLOY_KKPAN_SYNC_CRON_SECRET }}
          DEPLOY_JOB_REPORT_TOKEN: ${{ secrets.DEPLOY_JOB_REPORT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_ADMIN_PASSWORD DEPLOY_DOUBAN_API_URL DEPLOY_ADMIN_SESSION_SECRET DEPLOY_KKPAN_SYNC_CRON_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" != *$'\n'* ]] || { echo "DEPLOY_HOST contains a newline" >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || { echo "Invalid DEPLOY_USER" >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || { echo "Invalid DEPLOY_PATH" >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          [[ "$DEPLOY_BIND" =~ ^[A-Za-z0-9_.:-]+$ ]] || { echo "Invalid DEPLOY_BIND" >&2; exit 1; }
          [[ -z "$DEPLOY_JOB_REPORT_TOKEN" || "$DEPLOY_JOB_REPORT_TOKEN" =~ ^[A-Za-z0-9._~-]{32,512}$ ]] || {
            echo "DEPLOY_JOB_REPORT_TOKEN must be empty or a 32-512 character URL-safe secret" >&2
            exit 1
          }

      - name: Prepare SSH
        id: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/kerkerker_deploy_key"
          known_hosts="$RUNNER_TEMP/kerkerker_known_hosts"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          test -s "$known_hosts"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Upload Compose file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$KEY_FILE" -o BatchMode=yes -o UserKnownHostsFile="$KNOWN_HOSTS" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"
          scp -i "$KEY_FILE" -o BatchMode=yes -o UserKnownHostsFile="$KNOWN_HOSTS" \
            docker-compose.server.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.server.yml.new"

      - name: Upload environment file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
          DEPLOY_BIND: ${{ env.DEPLOY_BIND }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          ADMIN_PASSWORD: ${{ secrets.DEPLOY_ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.DEPLOY_ADMIN_SESSION_SECRET }}
          KKPAN_SYNC_CRON_SECRET: ${{ secrets.DEPLOY_KKPAN_SYNC_CRON_SECRET }}
          JOB_REPORT_TOKEN: ${{ secrets.DEPLOY_JOB_REPORT_TOKEN }}
          DOUBAN_API_URL: ${{ secrets.DEPLOY_DOUBAN_API_URL }}
          MONGODB_DB_NAME: ${{ secrets.DEPLOY_MONGODB_DB_NAME || 'kerkerker' }}
          KKPAN_API_BASE: ${{ secrets.DEPLOY_KKPAN_API_BASE || 'https://www.kkpans.com' }}
          DANMU_API_URL: ${{ secrets.DEPLOY_DANMU_API_URL }}
          DANMU_API_TOKEN: ${{ secrets.DEPLOY_DANMU_API_TOKEN }}
          SCHEDULER_DISABLED: ${{ vars.PAN_SYNC_SCHEDULER_DISABLED || 'false' }}
          SCHEDULER_POLL_MS: ${{ vars.PAN_SYNC_SCHEDULER_POLL_MS || '30000' }}
          CATALOG_JOB_MODE: ${{ vars.PAN_SYNC_CATALOG_JOB_MODE || 'off' }}
          PLUGIN_PROFILE: ${{ vars.KERKERKER_PLUGIN_PROFILE || 'cn-default' }}
          PLUGIN_REGION: ${{ vars.KERKERKER_PLUGIN_REGION || 'CN' }}
          TMDB_API_KEY: ${{ secrets.DEPLOY_TMDB_API_KEY }}
          TMDB_BASE_URL: ${{ secrets.DEPLOY_TMDB_BASE_URL || 'https://api.themoviedb.org/3' }}
          TMDB_IMAGE_BASE: ${{ secrets.DEPLOY_TMDB_IMAGE_BASE || 'https://image.tmdb.org/t/p/original' }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/kerkerker.env"
          umask 077
          python3 - "$env_file" <<'PY'
          import os
          import sys

          pairs = (
              ("IMAGE_NAME", "IMAGE_NAME"),
              ("IMAGE_TAG", "IMAGE_TAG"),
              ("APP_PORT", "DEPLOY_PORT"),
              ("APP_BIND", "DEPLOY_BIND"),
              ("ADMIN_PASSWORD", "ADMIN_PASSWORD"),
              ("ADMIN_SESSION_SECRET", "ADMIN_SESSION_SECRET"),
              ("KKPAN_SYNC_CRON_SECRET", "KKPAN_SYNC_CRON_SECRET"),
              ("CRON_SECRET", "KKPAN_SYNC_CRON_SECRET"),
              ("KERKERKER_JOB_REPORT_TOKEN", "JOB_REPORT_TOKEN"),
              ("MONGODB_DB_NAME", "MONGODB_DB_NAME"),
              ("NEXT_PUBLIC_DOUBAN_API_URL", "DOUBAN_API_URL"),
              ("KKPAN_API_BASE", "KKPAN_API_BASE"),
              ("NEXT_PUBLIC_DANMU_API_URL", "DANMU_API_URL"),
              ("NEXT_PUBLIC_DANMU_API_TOKEN", "DANMU_API_TOKEN"),
              ("PAN_SYNC_SCHEDULER_DISABLED", "SCHEDULER_DISABLED"),
              ("PAN_SYNC_SCHEDULER_POLL_MS", "SCHEDULER_POLL_MS"),
              ("PAN_SYNC_CATALOG_JOB_MODE", "CATALOG_JOB_MODE"),
              ("KERKERKER_PLUGIN_PROFILE", "PLUGIN_PROFILE"),
              ("KERKERKER_PLUGIN_REGION", "PLUGIN_REGION"),
              ("TMDB_API_KEY", "TMDB_API_KEY"),
              ("TMDB_BASE_URL", "TMDB_BASE_URL"),
              ("TMDB_IMAGE_BASE", "TMDB_IMAGE_BASE"),
          )

          def quote(value: str) -> str:
              if "\x00" in value or "\n" in value or "\r" in value:
                  raise ValueError("deployment environment values must be single-line")
              return "'" + value.replace("'", "\\'") + "'"

          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              for output_name, environment_name in pairs:
                  handle.write(f"{output_name}={quote(os.environ.get(environment_name, ''))}\n")
          PY
          chmod 600 "$env_file"
          scp -i "$KEY_FILE" -o BatchMode=yes -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$env_file" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.new"
          rm -f "$env_file"

      - name: Log in to GHCR on VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i "$KEY_FILE" -o BatchMode=yes -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Write environment and roll out
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
          DEPLOY_BIND: ${{ env.DEPLOY_BIND }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$KEY_FILE" -o BatchMode=yes -o UserKnownHostsFile="$KNOWN_HOSTS" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' APP_PORT='$DEPLOY_PORT' EXPECTED_IMAGE='$IMAGE_NAME:$IMAGE_TAG' EXPECTED_REVISION='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"
          if [ -f .env ]; then
            cp .env ".env.backup.$(date -u +%Y%m%d%H%M%S)"
          fi
          if [ -f docker-compose.server.yml ]; then
            cp docker-compose.server.yml docker-compose.server.yml.previous
          fi
          mv .env.new .env
          mv docker-compose.server.yml.new docker-compose.server.yml
          chmod 600 .env

          project=(docker compose --project-name kerkerker -f docker-compose.server.yml)
          previous_tag="$(for backup in .env.backup.*; do [ -f "$backup" ] || continue; awk -F= '$1 == "IMAGE_TAG" {print $2; exit}' "$backup"; done | tail -1 || true)"
          rollback() {
            echo "Deployment failed; restoring previous environment and image" >&2
            latest_backup="$(ls -1t .env.backup.* 2>/dev/null | head -1 || true)"
            if [ -n "$latest_backup" ]; then cp "$latest_backup" .env; fi
            if [ -f docker-compose.server.yml.previous ]; then mv docker-compose.server.yml.previous docker-compose.server.yml; fi
            "${project[@]}" up -d --remove-orphans || true
          }
          trap 'status=$?; if [ "$status" -ne 0 ]; then rollback; fi' EXIT

          "${project[@]}" pull app
          "${project[@]}" up -d mongodb
          for attempt in $(seq 1 30); do
            health="$(docker inspect -f '{{.State.Health.Status}}' kerkerker-mongodb 2>/dev/null || true)"
            [ "$health" = healthy ] && break
            [ "$attempt" -eq 30 ] && { echo "MongoDB did not become healthy" >&2; exit 1; }
            sleep 2
          done

          runtime=("${project[@]}" run --rm --no-deps --interactive=false -T app node)
          "${runtime[@]}" -e '
            (async () => {
              const base = String(process.env.NEXT_PUBLIC_DOUBAN_API_URL || "").replace(/\/$/, "");
              if (!base) throw new Error("NEXT_PUBLIC_DOUBAN_API_URL is empty");
              const response = await fetch(`${base}/api/v1/250`, { signal: AbortSignal.timeout(30000) });
              if (!response.ok) throw new Error(`Douban Top 250 returned HTTP ${response.status}`);
              const body = await response.json();
              if (!Array.isArray(body?.data?.subjects) || body.data.subjects.length !== 250) {
                throw new Error("Douban Top 250 response does not contain exactly 250 subjects");
              }
              console.log("Douban Top 250 capability is ready");
            })().catch((error) => { console.error(error); process.exit(1); });
          '

          "${runtime[@]}" /app/migrations/pan-dedup.cjs
          "${runtime[@]}" /app/migrations/content-identity-backfill.cjs
          echo "Migration previews completed"

          # Apply requires an exclusive writer window. Preview first to avoid
          # downtime when known data conflicts would block the migration.
          "${project[@]}" stop app >/dev/null 2>&1 || true
          "${runtime[@]}" /app/migrations/pan-dedup.cjs --apply --maintenance
          "${runtime[@]}" /app/migrations/content-identity-backfill.cjs --apply --maintenance
          echo "Maintenance migrations completed"

          "${project[@]}" up -d --remove-orphans app
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${APP_PORT}/api/health" >/dev/null; then
              running_image="$(docker inspect kerkerker-app --format '{{.Config.Image}}')"
              running_revision="$(docker inspect kerkerker-app --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
              [ "$running_image" = "$EXPECTED_IMAGE" ] || {
                echo "Running image mismatch: expected $EXPECTED_IMAGE, got $running_image" >&2
                exit 1
              }
              [ "$running_revision" = "$EXPECTED_REVISION" ] || {
                echo "Running revision mismatch: expected $EXPECTED_REVISION, got $running_revision" >&2
                exit 1
              }
              trap - EXIT
              echo "Kerkerker deployment healthy on port ${APP_PORT}"
              exit 0
            fi
            [ "$attempt" -eq 30 ] && { echo "Kerkerker health check failed" >&2; exit 1; }
            sleep 3
          done
          REMOTE

      - name: Deployment summary
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          echo "Deployed ${IMAGE_NAME}:${IMAGE_TAG} from ${GITHUB_REF_NAME}"
          echo "Server path: ${DEPLOY_PATH}"
          echo "Server port: ${DEPLOY_PORT}"
